{#- Printer + colour choice, shared by every print page (filled in by common.js). -#}
<div class="option">
  <label class="option-label" for="printer-select">Printer</label>
  <select id="printer-select" class="field select" aria-label="Printer"></select>
</div>
<div class="option" id="color-row" hidden>
  <span class="option-label">Colour</span>
  <div class="segmented" role="radiogroup" aria-label="Colour">
    <label><input type="radio" name="color" value="color" checked><span>Colour</span></label>
    <label><input type="radio" name="color" value="mono"><span>Black &amp; white</span></label>
  </div>
</div>
<div class="option" id="paper-row" hidden>
  <label class="option-label" for="paper-select">Paper</label>
  <select id="paper-select" class="field select" aria-label="Paper type"></select>
</div>
<div class="option" id="quality-row" hidden>
  <label class="option-label" for="quality-select">Quality</label>
  <select id="quality-select" class="field select" aria-label="Print quality"></select>
</div>
