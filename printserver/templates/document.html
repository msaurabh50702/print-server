{% extends "base.html" %}
{% block title %}Print document{% endblock %}
{% block heading %}Print document{% endblock %}
{% block content %}

<section id="step-upload" class="fade-in">
  <label class="dropzone" id="dropzone">
    <input id="doc-input" type="file" accept="{{ accept }}">
    <span class="drop-icon">{{ icon("upload") }}</span>
    <strong>Choose a document</strong>
    <span class="hint">PDF, Word, Excel, PowerPoint, text or image</span>
    <span class="btn primary small as-btn">Browse files</span>
  </label>
  <div id="upload-progress" class="progress" hidden>
    <div class="bar"><i></i></div>
    <span class="progress-text">Uploading&hellip;</span>
  </div>
</section>

<section id="step-preview" class="fade-in" hidden>
  <div class="doc-head card">
    <span class="choice-icon docs small">{{ icon("doc") }}</span>
    <div class="doc-meta">
      <strong id="doc-name"></strong>
      <span id="doc-pages" class="hint"></span>
    </div>
    <button id="other-doc" class="chip" type="button">{{ icon("swap") }}<span>Change</span></button>
  </div>

  <div id="pages" class="pages" aria-label="Page preview"></div>

  <div class="card options">
    <div class="option">
      <span class="option-label">Copies</span>
      <div class="stepper">
        <button type="button" data-step="-1" aria-label="Fewer copies">&minus;</button>
        <input id="copies" type="number" min="1" max="99" value="1" inputmode="numeric" aria-label="Copies">
        <button type="button" data-step="1" aria-label="More copies">+</button>
      </div>
    </div>
    <div class="option">
      <span class="option-label">Sides</span>
      <div class="segmented" role="radiogroup" aria-label="Sides">
        <label><input type="radio" name="sides" value="one" checked><span>One-sided</span></label>
        <label><input type="radio" name="sides" value="two"><span>Two-sided</span></label>
      </div>
    </div>
    <div class="option">
      <span class="option-label">Pages</span>
      <div class="segmented" role="radiogroup" aria-label="Pages">
        <label><input type="radio" name="range" value="all" checked><span>All</span></label>
        <label><input type="radio" name="range" value="custom"><span>Custom</span></label>
      </div>
    </div>
    <div class="option" id="range-row" hidden>
      <label class="option-label" for="pages-range">Page numbers</label>
      <input id="pages-range" class="field" type="text" placeholder="e.g. 1-3, 5" inputmode="numeric" autocomplete="off">
    </div>
  </div>

  <div class="action-bar">
    <a id="open-pdf" class="btn ghost" target="_blank" rel="noopener" aria-label="Open PDF">{{ icon("open") }}<span class="hide-sm">Open PDF</span></a>
    <button id="print-doc" class="btn primary grow" type="button">{{ icon("print") }}<span>Print</span></button>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/document.js') }}"></script>
{% endblock %}
